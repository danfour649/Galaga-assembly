<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Galaga-assembly</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a0a18">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Galaga">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        * { box-sizing: border-box; }
        html, body {
            overscroll-behavior: none;
            touch-action: none;           /* no pinch-zoom / pan while playing */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: #0a0a18;
            color: #c8d0e8;
            font-family: system-ui, -apple-system, sans-serif;
        }
        header { display: flex; align-items: center; gap: .75rem; }
        #mute {
            width: 2.75rem; height: 2.75rem; border-radius: 50%;
            border: 2px solid #3a3a58; background: #1a1a30; color: #c8d0e8;
            font-size: 1.15rem; line-height: 1; padding: 0; cursor: pointer;
            touch-action: manipulation;
        }
        #mute[aria-pressed="true"] { color: #6a7290; }
        #fs {
            width: 2.75rem; height: 2.75rem; border-radius: 50%;
            border: 2px solid #3a3a58; background: #1a1a30; color: #c8d0e8;
            padding: 0; cursor: pointer; touch-action: manipulation;
            display: inline-flex; align-items: center; justify-content: center;
        }
        #fs[hidden] { display: none; }
        #fs svg { width: 1.2rem; height: 1.2rem; }
        /* phones held sideways: the playfield would be tiny, ask for portrait */
        #rotate {
            display: none; position: fixed; inset: 0; z-index: 10;
            background: #0a0a18; color: #c8d0e8; font-size: 1.1rem;
            align-items: center; justify-content: center; text-align: center; padding: 2rem;
        }
        @media (orientation: landscape) and (pointer: coarse) and (max-height: 500px) {
            #rotate { display: flex; }
        }
        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        /* Border lives on the wrapper: SDL must not see it on the canvas. */
        #frame {
            border: 2px solid #2a2a48;
            background: #000;
            line-height: 0;
        }
        #canvas {
            display: block;
            width: min(448px, calc(100vw - 20px), calc((100vh - 9rem) * 224 / 288));
            width: min(448px, calc(100vw - 20px), calc((100dvh - 9rem) * 224 / 288));
            aspect-ratio: 224 / 288;
            image-rendering: pixelated;
            cursor: crosshair;
            touch-action: none;
        }
        #touch { display: none; gap: 1.25rem; justify-content: center; width: 100%; user-select: none; -webkit-user-select: none; }
        #touch button {
            width: 4.5rem; height: 4.5rem; border-radius: 50%;
            border: 2px solid #3a3a58; background: #1a1a30; color: #c8d0e8;
            font-size: 1.5rem; touch-action: none;
        }
        #touch button.active { background: #3a3a68; }
        @media (pointer: coarse) {
            #touch { display: flex; }
            .help { display: none; }
            h1 { font-size: 1rem; }
            body { gap: .5rem; }
            #canvas { width: min(448px, calc(100vw - 20px), calc((100dvh - 11rem) * 224 / 288)); }
        }
        #status {
            font-size: 0.875rem;
            color: #8890a8;
        }
        .help {
            font-size: 0.8rem;
            color: #6a7290;
            text-align: center;
            line-height: 1.5;
        }
        kbd {
            background: #1a1a30;
            border: 1px solid #3a3a58;
            border-radius: 3px;
            padding: 0.1em 0.35em;
            font-size: 0.85em;
        }
    </style>
    {{{ SCRIPT }}}
</head>
<body>
    <header>
        <h1>Galaga-assembly</h1>
        <button id="mute" aria-label="Mute sound" aria-pressed="false" title="Sound on/off (M)">&#128266;</button>
        <button id="fs" aria-label="Full screen" title="Full screen" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        </button>
    </header>
    <div id="frame"><canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas></div>
    <div id="touch">
        <button data-k="left" aria-label="Left">&#9664;</button>
        <button data-k="fire" aria-label="Fire">&#9679;</button>
        <button data-k="right" aria-label="Right">&#9654;</button>
    </div>
    <div id="status">Loading…</div>
    <div id="rotate">Turn your phone upright to play</div>
    <p class="help">
        Click the game to focus, then use <kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> to move,
        <kbd>Space</kbd> to fire, <kbd>M</kbd> to mute.<br>
        Gameplay runs in C with assembly logic mirrored by portable fallbacks for the web build.
    </p>
    <script>
        var statusEl = document.getElementById('status');
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('click', function () { canvas.focus(); });
        Module = {
            canvas: canvas,
            setStatus: function (text) {
                if (statusEl) statusEl.textContent = text;
            },
            onRuntimeInitialized: function () {
                if (statusEl) statusEl.textContent = matchMedia('(pointer: coarse)').matches
                    ? 'Tap \u25CF to start' : 'Click the game, then press Space to start';
            }
        };
        (function () {
            var held = { left: 0, right: 0, fire: 0 };
            function push() {
                if (Module._galaga_set_touch)
                    Module._galaga_set_touch(held.left, held.right, held.fire);
            }
            /* Sound: the audio device is opened only inside a user gesture
               (mobile autoplay rules). Mute is remembered on this device. */
            var muteBtn = document.getElementById('mute');
            var muted = false;
            try { muted = localStorage.getItem('galaga-muted') === '1'; } catch (e) {}
            function showMute() {
                muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;';
                muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
                muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
            }
            function applyMute() {
                if (Module._galaga_set_mute) Module._galaga_set_mute(muted ? 1 : 0);
                try { localStorage.setItem('galaga-muted', muted ? '1' : '0'); } catch (e) {}
                showMute();
            }
            function toggleMute() { muted = !muted; applyMute(); }
            function unlock() {
                if (!Module._galaga_audio_unlock) return;
                Module._galaga_audio_unlock();
                if (Module._galaga_set_mute) Module._galaga_set_mute(muted ? 1 : 0);
            }
            ['pointerdown', 'keydown', 'touchend'].forEach(function (t) {
                document.addEventListener(t, unlock, true);
            });
            muteBtn.addEventListener('click', function (e) { e.preventDefault(); toggleMute(); muteBtn.blur(); canvas.focus(); });
            document.addEventListener('keydown', function (e) {
                if ((e.key === 'm' || e.key === 'M') && !e.repeat) toggleMute();
            });
            showMute();
            /* keep a new best score if the tab is hidden or closed mid-game */
            function saveProgress() { if (Module._galaga_save_progress) Module._galaga_save_progress(); }
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'hidden') saveProgress();
            });
            window.addEventListener('pagehide', saveProgress);

            /* Full screen + portrait lock (best effort; hidden where the
               Fullscreen API is missing, e.g. iPhone Safari). */
            var fsBtn = document.getElementById('fs');
            var root = document.documentElement;
            var reqFs = root.requestFullscreen || root.webkitRequestFullscreen;
            var exitFs = document.exitFullscreen || document.webkitExitFullscreen;
            function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
            function lockPortrait() {
                try {
                    if (screen.orientation && screen.orientation.lock)
                        screen.orientation.lock('portrait').catch(function () {});
                } catch (e) {}
            }
            if (reqFs && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
                fsBtn.hidden = false;
                fsBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (fsElement()) {
                        exitFs.call(document);
                    } else {
                        var p = reqFs.call(root, { navigationUI: 'hide' });
                        if (p && p.then) p.then(lockPortrait, function () {}); else lockPortrait();
                    }
                    fsBtn.blur(); canvas.focus();
                });
                document.addEventListener('fullscreenchange', function () {
                    fsBtn.setAttribute('aria-label', fsElement() ? 'Exit full screen' : 'Full screen');
                });
            }
            /* installed (fullscreen/standalone display): lock too */
            if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) lockPortrait();

            /* offline / installable */
            if ('serviceWorker' in navigator &&
                (location.protocol === 'https:' || location.hostname === 'localhost')) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('sw.js').catch(function () {});
                });
            }

            document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
            document.addEventListener('dblclick', function (e) { e.preventDefault(); });
            document.querySelectorAll('#touch button').forEach(function (b) {
                var k = b.dataset.k;
                function set(v) { return function (e) {
                    e.preventDefault(); held[k] = v; b.classList.toggle('active', !!v); push();
                }; }
                b.addEventListener('pointerdown', set(1));
                b.addEventListener('pointerup', set(0));
                b.addEventListener('pointercancel', set(0));
                b.addEventListener('pointerleave', set(0));
            });
        })();
    </script>
</body>
</html>
