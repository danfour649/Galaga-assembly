name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            name: Linux x86_64
            os: ubuntu-latest
            shell: bash
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build libsdl2-dev nasm
            configure: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            binary: build/galaga
            artifact: galaga-linux-x86_64

          - id: macos
            name: macOS
            os: macos-latest
            shell: bash
            install: |
              brew install cmake ninja sdl2
              brew install nasm || true
            configure: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            binary: build/galaga
            artifact: galaga-macos

          - id: windows
            name: Windows x86_64
            os: windows-latest
            shell: msys2 {0}
            msys2-packages: >-
              mingw-w64-ucrt-x86_64-toolchain
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-ninja
              mingw-w64-ucrt-x86_64-SDL2
              mingw-w64-ucrt-x86_64-nasm
            configure: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            binary: build/galaga.exe
            artifact: galaga-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        if: matrix.id == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: ${{ matrix.msys2-packages }}

      - name: Install dependencies
        if: matrix.id != 'windows'
        run: ${{ matrix.install }}

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Publish latest release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: galaga-*
          path: dist

      - name: Rename binaries to unique filenames
        run: |
          mv dist/galaga-linux-x86_64/galaga dist/galaga-linux-x86_64/galaga-linux-x86_64
          mv dist/galaga-macos/galaga dist/galaga-macos/galaga-macos
          mv dist/galaga-windows-x86_64/galaga.exe dist/galaga-windows-x86_64/galaga-windows-x86_64.exe

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          make_latest: true
          body: Automatically published from the latest successful build of `main` at ${{ github.sha }}.
          files: |
            dist/galaga-linux-x86_64/galaga-linux-x86_64
            dist/galaga-macos/galaga-macos
            dist/galaga-windows-x86_64/galaga-windows-x86_64.exe
